<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posture Monitor</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: white;
    }
    #status {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    video, canvas {
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
    }
    canvas { display: none; }
  </style>
</head>
<body>
    <div id = "status">Starting...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id = "canvas"></canvas>
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const ctx = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({video:true}).then(Stream =>{
            video.srcObject = Stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                setInterval(sendFrame,500)

            };
        })
        .catch(err =>{
            status.textContext = "Camera Error: " + err.message;
        });
     
        let lastStatus = null

        function playbeep(){
          try{
            const audioContext = new AudioContext();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = 1000;
            gainNode.gain.value = 0.5
            
            oscillator.connect(gainNode)
            gainNode.connect(audioContext.destination)

            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.4)
          } catch(e){
            console.error('Beep Failed',e);
          }
        }

        async function sendFrame() {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file',blob, 'frame.jpg')
            try {
              const response = await fetch('http://localhost:8000/predict', {
                method : 'POST',
                body: formData
              });
              const data = await response.json();

              if(data.status == 'good'){
                status.textContent = 'Good Posture';
                status.style.color = '#00e676';
                lastStatus = 'good'
              } else if(data.status == 'bad'){
                status.textContent = 'Fix your posture';
                status.style.color = '#ff1744';
                playbeep();
                lastStatus = 'bad'
              }else{
                status.textContent = 'No person on the screen';
                status.style.color = '#aaa';
              }
            }catch(err){
              console.error(err)
              status.textContent = 'Server error';
            }
          },'image/jpeg',0.8)
        }
    </script>
</body>
</html>
